<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>Titulo</title>
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>

</head>

<body>

<div id="app">
    <p>Nombre: {{nombre}}</p>
    <p>Edad: {{edad}} </p>
    <p>Ciudad: {{ciudad}} </p>


    <p> Hola mi nombre es {{nombre}}, tengo {{edad}} años y vivo en {{ciudad}} </p>



</div>

<script>

    var app = new Vue({
        el:'#app',
        data: {
            nombre: "Ana García",
            edad: 30,
            ciudad: "Tupungato"
        },
    })

</script>

</body>

</html>
